name: Chess Game CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:

  # ============================================================
  # JOB 1 — Backend (Node.js)
  # ============================================================
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

  # ============================================================
  # JOB 2 — Java Engine
  # ============================================================
  java-engine:
    name: Java Engine (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & test Java engine
        working-directory: java-engine
        run: mvn --batch-mode clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-engine-jar
          path: java-engine/target/*.jar
          if-no-files-found: warn

  # ============================================================
  # JOB 3 — Frontend (Vite)
  # ============================================================
  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build (Vite)
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: warn

  # ============================================================
  # JOB 4 — Pytest
  # ============================================================
  pytest:
    name: Pytest (Unit Tests)
    runs-on: ubuntu-latest
    needs: [backend, java-engine, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install pytest httpx

      - name: Run unit tests
        run: pytest tests/backend/unit tests/java_engine/unit -v

      # הפעל אחרי שיש servers אמיתיים ב-CI
      # - name: Run integration tests
      #   run: pytest tests/backend/integration tests/java_engine/integration -v