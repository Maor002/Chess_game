<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>משחק שחמט - גרסה מודולרית</title>
    <link rel="stylesheet" href="./../../css/board-style.css" />
    <link rel="stylesheet" href="./../../css/alert.css" />
    <link rel="stylesheet" href="./../../css/base.css" />
  </head>
  <body>
    <!-- Language Switcher -->
    <div class="language-switcher">
      <button class="lang-btn active" data-lang="he" data-translate="lang-he">עברית</button>
      <button class="lang-btn" data-lang="en" data-translate="lang-en">English</button>
    </div>

    <div class="game-container">
      <h1 data-translate="game-title">♔ משחק שחמט ♛</h1>

      <!-- Room Status Panel (Multiplayer) -->
      <div class="room-status-panel" id="roomStatusPanel" style="display: none;">
        <div class="room-info">
          <div class="room-code-display">
            <label data-translate="room-code">קוד חדר:</label>
            <span id="roomCodeDisplay" class="code-value">---</span>
            <button class="btn-copy" id="copyRoomBtn" data-translate-title="copy-room-code" title="Copy room code">📋</button>
          </div>

          <div class="game-status">
            <label data-translate="game-status">סטטוס:</label>
            <span id="gameStatus" class="status-badge waiting" data-translate="status-waiting">⏳ מחכה</span>
          </div>
        </div>

        <div class="players-info">
          <div class="player-item">
            <span class="player-color white">⚪</span>
            <span class="player-name" id="whitePlayerName" data-translate="white-player-name">השחקן הלבן</span>
            <span class="player-status" id="whitePlayerStatus" data-translate="player-waiting">מחכה...</span>
          </div>
          <div class="player-item">
            <span class="player-color black">⚫</span>
            <span class="player-name" id="blackPlayerName" data-translate="black-player-name">השחקן השחור</span>
            <span class="player-status" id="blackPlayerStatus" data-translate="player-waiting">מחכה...</span>
          </div>
        </div>

        <div class="room-actions">
          <button class="btn" id="createRoomBtn" data-translate="create-room">יצירת חדר</button>
          <button class="btn" id="joinRoomBtn" data-translate="join-room">הצטרפות לחדר</button>
          <input
            type="text"
            id="joinRoomInput"
            data-translate-placeholder="join-room-placeholder"
            placeholder="הכנס קוד חדר"
            maxlength="6"
            style="display: none;"
          />
        </div>
      </div>

      <!-- Game Info -->
      <div class="game-info">
        <div
          class="turn-indicator"
          id="turnIndicator"
          data-translate="white-turn"
        >
          תור הלבן
        </div>
      </div>

      <!-- Main Game Area -->
      <div class="main-game-area">
        <!-- Left Panel - Moves List -->
        <div class="left-panel">
          <div class="moves-panel">
            <h3 data-translate="moves-list">📝 רשימת המהלכים</h3>
            <div class="moves-list" id="movesList"></div>
          </div>
        </div>

        <!-- Right Panel - Chess Board and Captured Pieces -->
        <div class="right-panel">
          <!-- Captured Pieces -->
          <div class="captured-pieces-display">
            <h3 data-translate="captured-pieces">♜ כלים שנתפסו ♜</h3>
            <div class="captured-list" id="capturedPieces"></div>
          </div>

          <!-- Chess Board -->
          <div class="board-container">
            <div class="board-with-coordinates">
              <div class="coordinates numbers-left">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
              </div>
              <div class="chess-board" id="chessBoard"></div>
              <div class="coordinates letters-bottom">
                <span>H</span><span>G</span><span>F</span><span>E</span>
                <span>D</span><span>C</span><span>B</span><span>A</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Game Controls -->
      <div class="game-controls">
        <button class="btn new-game-btn" id="new-game-btn" data-translate="new-game">
          משחק חדש
        </button>
        <button class="btn" id="undo-btn" data-translate="undo-move">
          מהלך קודם
        </button>
        <button class="btn" id="redo-btn" data-translate="redo-move">
          מהלך הבא
        </button>
        <button class="btn" id="save-btn" data-translate="save-game">
          שמור משחק
        </button>
      </div>

      <!-- Status Message -->
      <div class="status-message" id="statusMessage"></div>
    </div>

    <!-- Alert Modal Container (will be created by AlertUI class) -->
    <div id="alertContainer"></div>

    <!-- קישור לקבצי JavaScript -->
    <script type="module" src="./../../js/ui/pages-manager/BoardRouter.js"></script>

  </body>
</html>
